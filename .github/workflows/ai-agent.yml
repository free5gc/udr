name: 🚀 AI Agent Fix (free5gc)

on:
  issues:
    types: [labeled] # 監聽標籤變動

jobs:
  run-agent:
    runs-on: ubuntu-latest
    # 🌟「開關」設定：只有當標籤是 'ai-fix' 時才執行
    if: github.event.label.name == 'ai-fix'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 獲取完整歷史以利 Agent 分析

      # 🌟 因為是 free5gc (Go 專案)，我們必須先準備好 Go 環境
      - name: 🐹 Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21' # 請依照 free5gc 版本需求調整

      - name: 📦 Setup Bun (GitClaw 環境)
        uses: oven-sh/setup-bun@v1

      # 🌟 在 Agent 開始前先準備一個新的 Branch
      - name: 🌿 Prepare AI Branch
        run: |
          BRANCH_NAME="ai-fix-${{ github.event.issue.number }}"
          git config --global user.name "free5gc-ai-bot"
          git config --global user.email "bot@free5gc.org"
          git checkout -b $BRANCH_NAME

      # 🌟 執行 GitClaw (它會讀取 Issue 並在當前 Branch 修改代碼)
      - name: 🤖 Run GitClaw Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 告訴 GitClaw 它是為哪個 Issue 服務
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # 這行指令會讀取 ISSUSE_NUMBER 變數
          bunx pi --issue-number "$ISSUE_NUMBER"

      # 🌟 執行基本 Go 格式化 (可選，但能保持代碼整潔)
      - name: 🧹 Format Code
        run: go fmt ./...

      # 🌟 提交變動並自動發起 PR
      - name: 🎁 Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="ai-fix-${{ github.event.issue.number }}"
          # 1. 將 Agent 的所有修改 commit 下來
          git add .
          
          # 2. 檢查是否有實際代碼變動 (若無則 commit 會失敗)
          if ! git diff --cached --exit-code --quiet; then
            git commit -m "AI: fix issue #${{ github.event.issue.number }}"
            
            # 3. Push 到原倉庫
            git push -u origin $BRANCH_NAME
            
            # 4. 使用 GitHub CLI 建立 PR
            gh pr create --title "AI Fix: ${{ github.event.issue.title }}" \
                         --body "This is an automated PR generated by GitClaw in response to issue #${{ github.event.issue.number }}." \
                         --base ${{ github.event.repository.default_branch }} \
                         --head $BRANCH_NAME
            
            echo "PR created successfully!"
          else
            echo "No changes were made by the agent."
          fi